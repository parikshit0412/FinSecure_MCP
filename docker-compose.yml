services:
  postgres:
    image: postgres:16-alpine
    container_name: finsecure_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: finsecure_db
    ports:
      - "5433:5432"
    volumes:
      - finsecure_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finsecure_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsecure_app
    ports:
      - "8080:10000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/finsecure_db
      - USE_SQLITE=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=10000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  finsecure_pgdata:
